name: A value is missing or wrong on a device
description: An unnamed value, a value read wrong, or a control that does nothing
title: "Device report: "
body:
  - type: markdown
    attributes:
      value: |
        Your device is recognised from what it reports. What this form is for
        is what its values *mean* : the same capability id can mean something
        else on another product family. If a notice in Home Assistant sent you
        here, the diagnostics file is the important part.

  - type: textarea
    id: problem
    attributes:
      label: What you see, and what you expected
      description: >
        An unnamed value, a wrong unit, a raw number where the app shows a
        word, a reading that never moves, a control that does nothing or that
        the app has and Home Assistant does not. Name the device it is on.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      description: >
        Drag the file in here. **Settings → Devices & services → Cozytouch →
        ⋮ → Download diagnostics**. One file covers the whole account; your
        credentials and address are stripped out.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots of the Cozytouch app
      description: >
        Drag the images in here: the device's screen and the screens behind it
        (modes, schedule, settings). The file says what a device reports; only
        the app says what a value means and what you can do with it.
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.1"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "2026.10.0"
    validations:
      required: true
