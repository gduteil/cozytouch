name: Catalogue

# Atlantic's capability, model and product catalogues are where
# capability_table.py, model_catalogue.py and model.py's productId ranges came
# from, and nothing announces an edit to any of them.
# scripts/*_catalogue.jsonl is what they said last time ; this re-reads all
# three and opens an issue for each that differs.
#
# Twice a month. The catalogue moves at the speed of firmware families, so
# this is already generous -- and each run is one login against a personal
# account, which is not something to do hourly.
on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The script says what it found through its exit code : 0 unchanged,
      # 10 changed, 2 the fetch failed. Captured here rather than let the step
      # fail, so the run is red only when something is wrong -- and so the
      # catalogue is read once. A retry is a second login, and repeated failed
      # logins are what could lock the account.
      #
      # "Changed" is 10 and not 1 because Python exits 1 on an uncaught
      # traceback. It did, on the first run : the import reached for aiohttp,
      # which a bare runner does not have, and the empty diff opened #144.
      - name: Re-read the catalogue
        id: check
        run: |
          set +e
          python3 scripts/check_capability_catalogue.py
          echo "status=$?" >> "$GITHUB_OUTPUT"
        env:
          COZYTOUCH_USER: ${{ secrets.COZYTOUCH_USER }}
          COZYTOUCH_PASS: ${{ secrets.COZYTOUCH_PASS }}

      - name: Fail if the catalogue could not be read
        if: steps.check.outputs.status == '2'
        run: |
          echo "Credentials, or Atlantic is down. Nothing was rewritten."
          exit 1

      # Anything that is not one of the three is the script crashing, and a
      # crash must not pass for an answer.
      - name: Fail on an exit code that means nothing
        if: >-
          steps.check.outputs.status != '0' &&
          steps.check.outputs.status != '2' &&
          steps.check.outputs.status != '10'
        run: |
          echo "check_capability_catalogue.py exited ${{ steps.check.outputs.status }}."
          exit 1

      # One issue per catalogue that moved, so each is closed by its own
      # work. The capability title is what the implementing routine keys on,
      # so it is kept as it was. A file not yet committed has no diff, and
      # opens nothing rather than an issue listing every model as new.
      - name: Open an issue per catalogue that changed
        if: steps.check.outputs.status == '10'
        run: |
          report() {
            file=$1 title=$2 todo=$3
            git diff --quiet -- "$file" && return
            git diff --stat -- "$file" | tail -1
            {
              echo "Atlantic's catalogue is not what \`$file\` last recorded."
              echo
              echo "$todo"
              echo
              git diff -U0 -- "$file" > change.diff
              echo '```diff'
              head -c 40000 change.diff
              echo '```'
              if [ "$(wc -c < change.diff)" -gt 40000 ]; then
                echo
                echo "**Truncated** : the diff is over 40000 characters and will not apply."
              fi
              echo
              echo "Reproduce locally with \`python3 scripts/check_capability_catalogue.py\`."
              echo "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > body.md
            gh issue create --title "$title" --assignee mathieuletyrant --body-file body.md
          }
          report scripts/capability_catalogue.jsonl \
            "Atlantic changed the capability catalogue" \
            "A new id needs a row in \`capability_table.py\` and a name in every translation file. A changed enum or unit may mean a row that is now wrong."
          report scripts/model_catalogue.jsonl \
            "Atlantic changed the model catalogue" \
            "A new model needs its name in \`model_catalogue.py\` and its productId in \`model_product_ids.py\` ; \`tests/test_model_catalogue_sync.py\` says which, once this file is committed."
          report scripts/product_catalogue.jsonl \
            "Atlantic changed the product catalogue" \
            "A new productId is a kind of device \`model.py\` has never classified : find its family before giving it a range."
        env:
          GH_TOKEN: ${{ github.token }}
