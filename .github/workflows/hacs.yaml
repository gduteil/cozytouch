name: HACS validation

on:
  push:
    branches:
      - "main"
  pull_request:
    # The base branch, so a stacked pull request gets checks too -- see the
    # comment in tests.yaml.
    branches:
      - "main"
      - "claude/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # brands : drop this once the integration has images in
          # https://github.com/home-assistant/brands
          # license : this repo forks gduteil/cozytouch, which ships no
          # licence at all. Most of the code here is still theirs, so we have
          # no standing to put a licence on it — that is the upstream author's
          # call. Ignoring the check keeps the other seven honest instead of
          # leaving the whole workflow red. Cost of it: HACS will not accept
          # the repo in its default store while there is no licence; installing
          # it as a custom repository, which is how anyone gets it today, is
          # unaffected.
          ignore: "brands license"
