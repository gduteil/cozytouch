name: Validate with hassfest

on:
  push:
    branches:
      - "main"
  pull_request:
    # The base branch, so a stacked pull request gets checks too -- see the
    # comment in tests.yaml.
    branches:
      - "main"
      - "claude/**"
  schedule:
    - cron:  '0 0 * * *'

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v4"
        - uses: "home-assistant/actions/hassfest@master"
