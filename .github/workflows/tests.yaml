# Why any of the below is what it is -- the installer, the pins, the shape of
# the matrix -- is in docs/decisions.md.
name: Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    # Not only `main`: this list filters on the *base* branch, so a pull
    # request stacked on another one -- the shape every dependent change here
    # takes -- got no checks at all rather than failing ones. Two open pull
    # requests had never been tested anywhere because of it. `claude/**` covers
    # the branch names this repository actually uses.
    branches:
      - "main"
      - "claude/**"
  workflow_dispatch:

jobs:
  ruff:
    name: ruff
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: Install lint requirements
        run: pip install -r requirements_lint.txt
      - name: Run ruff
        run: ruff check --output-format=github .

  pyright:
    name: pyright
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14.2"
      - name: Install uv
        run: pip install uv==0.12.6
      # The full pinned test environment, not the lint one: pyright resolves
      # the homeassistant imports, so it needs the package ruff never looks at.
      - name: Install test requirements and pyright
        run: |
          uv venv --python "$(which python)" .venv
          uv pip install --python .venv/bin/python -r requirements_test.txt -r requirements_typecheck.txt
      - name: Run pyright
        run: .venv/bin/pyright

  pytest-matrix:
    name: pytest (HA ${{ matrix.homeassistant }} on Python ${{ matrix.python }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14.2"
            homeassistant: "2026.8.3"
            requirements: "requirements_test.txt"
          - python: "3.13.7"
            homeassistant: "2025.12.0"
            requirements: "requirements_test_min.txt"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python }}"
      - name: Install uv
        run: pip install uv==0.12.6
      - name: Install test requirements
        run: |
          uv venv --python "$(which python)" .venv
          uv pip install --python .venv/bin/python -r ${{ matrix.requirements }}
      - name: Show what was installed
        run: |
          uv pip show --python .venv/bin/python homeassistant pytest \
            | grep -E "^(Name|Version)"
      - name: Run pytest
        run: .venv/bin/pytest tests/ -q

  # A job that only agrees with the matrix, so that the name `pytest` keeps
  # reporting -- see docs/decisions.md.
  pytest:
    runs-on: "ubuntu-latest"
    needs: pytest-matrix
    if: always()
    steps:
      - name: Fail unless every combination passed
        run: |
          echo "pytest-matrix: ${{ needs.pytest-matrix.result }}"
          test "${{ needs.pytest-matrix.result }}" = "success"
